# 존냥이 말투 사전 (사람이 편집하는 파일)
#
# 규칙
# - {중괄호} 안은 스킬이 넘겨준 값이다. 숫자·시간·경로 같은 핵심 값은 빼먹어도 문장 끝에 자동으로 붙는다.
# - 값이 여러 개인 리스트는 랜덤으로 하나 고른다.
# - {items}는 목록 줄들(각 줄은 *.item 템플릿), {note}는 시간 해석 가정("오후로 알아들음" 등)이다.
# - 프로필 체인: 현재 프로필 → fallback → plain. 냥체를 끄면 plain만 쓴다.
# - 새 말투를 만들려면 profiles 아래에 추가하고 fallback: soft 를 주면 바꾸고 싶은 키만 적으면 된다.

