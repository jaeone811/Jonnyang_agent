# ───────────── 데스크톱 펫 (GUI) ─────────────
# 고양이 색. 코드가 아니라 여기서 바꾼다.
appearance:
  # 컨셉 아트: 하얀 장모 고양이 + 파란 눈 + 금색 왕관 + 남색 망토 (팔레트: 흰색, 연보라, 파랑, 남색, 금색)
  fur: "#FFFFFF"         # 털
  fur_shade: "#E6E3F6"   # 털 그늘 (연보라)
  outline: "#9D98CC"     # 테두리
  ear_inner: "#F8B5CD"
  eye_top: "#1D2470"     # 눈 위쪽 (짙은 남색)
  eye_bottom: "#62A6FF"  # 눈 아래쪽 (밝은 파랑)
  eye_line: "#2A2458"    # 눈꺼풀 선, 감은 눈
  blush: "#FFB0C6"
  nose: "#F28BA8"
  mouth: "#7A5A8C"
  tongue: "#FF8FA8"
  cape: "#26306C"        # 망토
  cape_light: "#3B4796"
  gold: "#F0C150"        # 왕관, 망토 테두리, 브로치
  gold_dark: "#B98A2C"
  gem: "#3F7BFF"         # 왕관·브로치 보석
  tail_tip: "#F3C95E"    # 꼬리 끝 금빛
  mark: "#5B8DEF"        # 머리 위 ? z … 기호
  sparkle: "#F5C443"     # 반짝이
  bubble_bg: "#FDFCFF"
  bubble_text: "#262150"
  bubble_border: "#D8D3F2"
  input_focus: "#7E8FE0"
  state:                 # 말풍선 상태 점 색 (Codex 펫처럼: 작업 중 / 입력 필요 / 완료 / 문제 + 알림)
    running: "#4C8BF5"
    needs_input: "#F5A524"
    ready: "#2BB673"
    blocked: "#E5484D"
    alert: "#FF5C8A"

# 그림(스프라이트) 고양이: 표정 → 애니메이션. 그림은 src/jonnyang/gui/sprites/ (tools/extract_sprites.py로 만든다).
# enabled를 false로 하거나 그림 파일이 없으면 도형으로 그린 고양이(painter.py)가 나온다.
# anim: 그림 이름, fps: 초당 프레임, motion: breathe(숨쉬기) float(둥실) hop(깡총) shake(흔들),
# mark: "?" 또는 dots(생각 중 점), clock: t면 표정이 바뀌어도 이어서 재생, shadow: 그림자 폭
# 그림 이름: idle sleep happy surprise magic coding error (여러 장) /
#           front wait wink yawn love float stretch search files notify cheer book (한 장)
sprites:
  enabled: true
  poses:
    idle:     {anim: idle, fps: 5}
    listen:   {anim: wait, motion: breathe}
    happy:    {anim: happy, fps: 8, motion: hop}
    love:     {anim: love, motion: hop breathe}
    alert:    {anim: surprise, fps: 8, motion: hop shake}
    confused: {anim: error, fps: 6}
    sad:      {anim: error, fps: 4}
    ask:      {anim: front, motion: breathe, mark: "?"}
    sleep:    {anim: sleep, fps: 2.5, clock: t, shadow: 84}
    think:    {anim: search, motion: breathe, mark: dots}
    search:   {anim: coding, fps: 6}
    book:     {anim: magic, fps: 7, motion: float}
    files:    {anim: files, motion: breathe, mark: dots}
    drag:     {anim: float, motion: float, shadow: 50}     # 끌고 다닐 때
  idle_extras: [wink, yawn, stretch, cheer]   # 가만히 있으면 가끔 하는 동작
  idle_extra_every: 24                        # 몇 초마다
  idle_extra_sec: 2.4                         # 몇 초 동안

# 응답 키 → 표정. 위에서부터 처음 맞는 규칙을 쓴다(* 와일드카드).
# 표정: idle happy confused alert ask sleep think listen search(노트북) book(마법책) files(폴더) sad love
poses:
  default: happy          # 규칙에 없고 성공
  error: confused         # 규칙에 없고 실패
  rules:
    - ["online.loading", search]
    - ["online.*", sad]
    - ["wiki.*", book]
    - ["meta.help", book]
    - ["confirm.files_*", ask]
    - ["files.*", files]
    - ["*.done", alert]
    - ["*.missed", alert]
    - ["confirm.*", ask]
    - ["clarify*", ask]
    - ["ask.*", ask]
    - ["excluded_only", ask]
    - ["fallback", confused]
    - ["chat.thanks", love]
    - ["chat.pet", love]
    - ["time.*", confused]
    - ["error.*", confused]
    - ["negated", idle]
    - ["cancelled", idle]
    - ["undo.nothing", idle]
    - ["wake", listen]
    - ["status.waiting", ask]
    - ["status.*", think]
    - ["sys.*", think]

