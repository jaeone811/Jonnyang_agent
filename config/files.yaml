# 파일 찾기·정리 설정 (사람이 편집하는 파일, 프로그램은 읽기만 함)
#
# 안전 규칙 (코드에서 강제함)
# - 파일 작업은 aliases.yaml의 folders(바탕화면, 다운로드 등) 안에서만 한다.
# - 삭제는 휴지통으로만 보낸다(영구삭제 없음). 휴지통·이동·정리는 실행 전에 대상 목록을 보여주고 확인을 받는다.
# - 이동·정리·이름 바꾸기는 "되돌려"로 원래대로 돌릴 수 있다. 같은 이름 파일이 있으면 덮어쓰지 않고 " (2)"를 붙인다.

search_folders: [바탕화면, 다운로드, 문서]   # 폴더를 말하지 않았을 때 찾는 곳
max_depth: 3          # 하위 폴더 몇 단계까지
max_scan: 5000        # 한 번에 훑어볼 최대 항목 수 (느려지지 않게)
max_results: 10       # 말풍선에 보여줄 개수
max_batch: 30         # 한 번에 휴지통·이동할 수 있는 최대 개수
old_days: 30          # "오래된"의 기준 (일)
skip_dirs: [node_modules, .git, AppData, $RECYCLE.BIN, System Volume Information, __pycache__]
skip_suffixes: [.crdownload, .part, .partial, .tmp, .download, .lnk]
skip_names: [desktop.ini, thumbs.db, .ds_store]

# 정리할 때 만드는 폴더 이름 → 확장자
categories:
  이미지: [jpg, jpeg, png, gif, bmp, webp, heic, svg, tif, tiff]
  문서: [pdf, doc, docx, hwp, hwpx, txt, rtf, odt, ppt, pptx, xls, xlsx, csv, md]
  압축파일: [zip, rar, 7z, tar, gz, alz, egg]
  설치파일: [exe, msi]
  동영상: [mp4, mkv, avi, mov, wmv, webm]
  음악: [mp3, wav, flac, m4a, aac, ogg]

# 말 → 찾을 확장자 (카테고리 이름이나 확장자 목록)
type_words:
  사진: 이미지
  이미지: 이미지
  그림: 이미지
  스크린샷: [png]
  캡처: [png, jpg]
  문서: 문서
  pdf: [pdf]
  피디에프: [pdf]
  엑셀: [xls, xlsx, csv]
  한글: [hwp, hwpx]
  한글파일: [hwp, hwpx]
  워드: [doc, docx]
  ppt: [ppt, pptx]
  피피티: [ppt, pptx]
  파워포인트: [ppt, pptx]
  텍스트: [txt, md]
  압축: 압축파일
  압축파일: 압축파일
  zip: [zip]
  설치: 설치파일
  설치파일: 설치파일
  exe: [exe]
  동영상: 동영상
  영상: 동영상
  비디오: 동영상
  음악: 음악
  노래: 음악
  mp3: [mp3]
