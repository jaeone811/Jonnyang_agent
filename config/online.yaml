# 온라인 기능 설정 (사람이 편집하는 파일, 프로그램은 읽기만 함)
# 인터넷이 없거나 서버가 응답하지 않으면 해당 기능만 "지금은 못 한다"고 안내하고 나머지는 그대로 동작한다.

enabled: true            # false면 온라인 기능을 전부 끈다 ("인터넷 기능 꺼" 명령도 있음, 그쪽이 우선)
timeout_sec: 6

# ── 날씨·미세먼지: Open-Meteo (API 키 없음, 비상업 무료, 데이터 CC BY 4.0) ──
weather:
  forecast_url: https://api.open-meteo.com/v1/forecast
  air_url: https://air-quality-api.open-meteo.com/v1/air-quality
  geocode_url: https://geocoding-api.open-meteo.com/v1/search
  cache_min: 10
  default_place: 서울     # "우리 동네 부산으로 설정" 명령으로 바꾼 값이 우선
  # WMO 날씨 코드 → 표시 이름 (https://open-meteo.com/en/docs 의 WMO Weather interpretation codes)
  codes:
    0: 맑음
    1: 대체로 맑음
    2: 구름 조금
    3: 흐림
    45: 안개
    48: 서리 안개
    51: 약한 이슬비
    53: 이슬비
    55: 강한 이슬비
    56: 약한 어는 이슬비
    57: 강한 어는 이슬비
    61: 약한 비
    63: 비
    65: 강한 비
    66: 약한 어는 비
    67: 강한 어는 비
    71: 약한 눈
    73: 눈
    75: 강한 눈
    77: 싸락눈
    80: 약한 소나기
    81: 소나기
    82: 강한 소나기
    85: 약한 눈보라
    86: 강한 눈보라
    95: 뇌우
    96: 우박 동반 뇌우
    97: 강한 뇌우
    99: 강한 우박 동반 뇌우
  rain_codes: [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82, 95, 96, 97, 99]
  snow_codes: [71, 73, 75, 77, 85, 86]
  umbrella_percent: 50    # 강수 확률이 이 이상이면 우산 챙기라고 한다

# 미세먼지 등급 (환경부 예보 기준, ㎍/㎥ 이하). 2018-03-27 강화된 초미세먼지 기준.
# Open-Meteo 값은 측정소 실측이 아니라 CAMS 대기 모델 추정치다.
air_grades:
  pm10: [[30, 좋음], [80, 보통], [150, 나쁨], [99999, 매우나쁨]]
  pm2_5: [[15, 좋음], [35, 보통], [75, 나쁨], [99999, 매우나쁨]]

