# ── 환율: Frankfurter v2 (API 키 없음, 각국 중앙은행 기준 환율, 하루 한 번 갱신) ──
currency:
  url: https://api.frankfurter.dev/v2/rates
  cache_min: 60
  names:              # 말 → 통화 코드 (긴 이름부터 찾는다)
    미국 달러: USD
    달러: USD
    불: USD
    엔화: JPY
    엔: JPY
    유로: EUR
    위안화: CNY
    위안: CNY
    영국 파운드: GBP
    파운드: GBP
    홍콩 달러: HKD
    대만 달러: TWD
    싱가포르 달러: SGD
    호주 달러: AUD
    캐나다 달러: CAD
    스위스 프랑: CHF
    프랑: CHF
    바트: THB
    베트남 동: VND
    루피: INR
    원화: KRW
    원: KRW
  display:
    USD: 달러
    JPY: 엔
    EUR: 유로
    CNY: 위안
    GBP: 파운드
    HKD: 홍콩 달러
    TWD: 대만 달러
    SGD: 싱가포르 달러
    AUD: 호주 달러
    CAD: 캐나다 달러
    CHF: 스위스 프랑
    THB: 바트
    VND: 베트남 동
    INR: 루피
    KRW: 원
  per_100: [JPY, VND]   # 한국에서 100단위로 말하는 통화 ("100엔에 900원")

# ── 위키백과 요약 (MediaWiki Action API, 한국어판) ──
wiki:
  url: https://ko.wikipedia.org/w/api.php
  cache_min: 1440
  max_chars: 300

# ── 뉴스 (RSS, feedparser) ── 제목과 링크만 보여준다
news:
  cache_min: 10
  max_items: 5
  feeds:
    주요: https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko
    IT: https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=ko&gl=KR&ceid=KR:ko
    경제: https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko
    스포츠: https://news.google.com/rss/headlines/section/topic/SPORTS?hl=ko&gl=KR&ceid=KR:ko
    연예: https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=ko&gl=KR&ceid=KR:ko
    세계: https://news.google.com/rss/headlines/section/topic/WORLD?hl=ko&gl=KR&ceid=KR:ko
    과학: https://news.google.com/rss/headlines/section/topic/SCIENCE?hl=ko&gl=KR&ceid=KR:ko
    건강: https://news.google.com/rss/headlines/section/topic/HEALTH?hl=ko&gl=KR&ceid=KR:ko
  topic_words:          # 말 → 위 feeds 키
    아이티: IT
    it: IT
    테크: IT
    기술: IT
    경제: 경제
    주식: 경제
    증시: 경제
    스포츠: 스포츠
    축구: 스포츠
    야구: 스포츠
    연예: 연예
    세계: 세계
    해외: 세계
    국제: 세계
    과학: 과학
    건강: 건강
  search_url: https://news.google.com/rss/search?hl=ko&gl=KR&ceid=KR:ko
