# 존냥이 동작 설정 (사람이 편집하는 파일)

# true면 "존냥아 ~"로 시작하는 말만 명령으로 처리한다. "호출어 켜/꺼" 명령으로도 바꿀 수 있다(그 값이 우선).
wake_required: false

# 의도 매칭 임계값
thresholds:
  execute: 0.70   # 1위 점수가 이 이상이고
  margin: 0.15    # 2위와 이만큼 차이 나면 실행
  clarify: 0.40   # 이 이상이면 되묻기, 미만이면 "모르겠다냥"

# 되묻기/확인 대기 시간(초). 지나면 대기를 버린다.
pending_timeout_sec: 60

# 날짜만 있고 시각이 없는 리마인더의 기본 시각
default_reminder_hour: 9
